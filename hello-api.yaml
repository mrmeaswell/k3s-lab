apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
spec:
  replicas: 3
  selector:
    matchLabels: {app: hello-api}
  template:
    metadata:
      labels: {app: hello-api}
    spec:
      containers:
      - name: hello-api
        image: brustin/hello-api:0.1
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          value: "0.1"
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 8000}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-api
spec:
  selector: {app: hello-api}
  ports:
  - port: 80
    targetPort: 8000
