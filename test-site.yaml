apiVersion: v1
kind: ConfigMap
metadata: {name: test-site, namespace: sites}
data:
  index.html: |
    <!doctype html><html><head><title>bkn-sites</title></head>
    <body style="font-family:sans-serif;text-align:center;margin-top:20vh">
    <h1>It works.</h1><p>Served from the bkn k3s cluster through Cloudflare Tunnel.</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: test-site, namespace: sites}
spec:
  replicas: 2
  selector: {matchLabels: {app: test-site}}
  template:
    metadata: {labels: {app: test-site}}
    spec:
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:stable-alpine
        ports: [{containerPort: 8080}]
        volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
      volumes:
      - name: html
        configMap: {name: test-site}
---
apiVersion: v1
kind: Service
metadata: {name: test-site, namespace: sites}
spec:
  selector: {app: test-site}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: test-site, namespace: sites}
spec:
  rules:
  - host: test.bknown.pro
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: test-site, port: {number: 80}}
